# Local development: Django + PostgreSQL + Redis + Celery (worker and scheduler).
#   docker compose up --build
#   docker compose exec web python manage.py seed_demo
# Then open http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartcart_db
      POSTGRES_USER: smartcart
      # Local-only password; the database port is not published to the host.
      POSTGRES_PASSWORD: smartcart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcart -d smartcart_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    # Django's dev server reloads when you edit code (the project folder is mounted).
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - path: .env
        required: false
    environment: &app-env
      DEBUG: "True"
      DATABASE_URL: postgresql://smartcart:smartcart@db:5432/smartcart_db
      DATABASE_SSL_REQUIRE: "False"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background jobs: emails, push notifications, WebP image copies.
  worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started

  # Scheduled jobs (see CELERY_BEAT_SCHEDULE): unpaid orders, price alerts, abandoned carts.
  beat:
    build: .
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    volumes:
      - .:/app
    depends_on:
      web:
        condition: service_started

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
