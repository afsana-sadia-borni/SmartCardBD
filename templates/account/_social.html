{% load i18n socialaccount %}
{% get_providers as socialaccount_providers %}
{% if socialaccount_providers %}
    <div class="auth-divider my-3"><span>{% translate "or" %}</span></div>
    {% for provider in socialaccount_providers %}
        <a href="{% provider_login_url provider process='login' %}" class="btn btn-outline-secondary w-100 mb-2"><i class="bi bi-{{ provider.id }}"></i> {% blocktranslate with name=provider.name %}Continue with {{ name }}{% endblocktranslate %}</a>
    {% endfor %}
{% endif %}
