{% load shop_tags %}<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f1f3f5;font-family:Arial,Helvetica,sans-serif;color:#212529;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f3f5;padding:24px 12px;">
    <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr><td style="background:#212529;padding:18px 24px;">
                <a href="{{ site_url }}" style="color:#ffc107;font-size:20px;font-weight:bold;text-decoration:none;">&#128717; {{ site_name }}</a>
            </td></tr>
            <tr><td style="padding:24px;font-size:15px;line-height:1.5;">
                {% block content %}{% endblock %}
            </td></tr>
            <tr><td style="background:#f8f9fa;padding:16px 24px;font-size:12px;color:#6c757d;">
                You are receiving this because you placed an order or have an account at {{ site_name }}.<br>
                <a href="{{ site_url }}" style="color:#6c757d;">{{ site_url }}</a>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
