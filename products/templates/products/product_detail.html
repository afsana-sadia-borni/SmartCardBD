{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <!-- Product Image -->
        <div class="col-md-6 mb-4">
            {% if product.image %}
                <img src="{{ product.image.url }}" class="img-fluid rounded shadow" alt="{{ product.name }}">
            {% else %}
                <img src="https://via.placeholder.com/500" class="img-fluid rounded shadow" alt="No image">
            {% endif %}
        </div>

        <!-- Product Details -->
        <div class="col-md-6">
            <h2 class="display-5 fw-bold">{{ product.name }}</h2>
            <h3 class="text-primary my-3">৳ {{ product.price }}</h3>
            <p class="lead text-muted">{{ product.description }}</p>

            <hr class="my-4">

            <!-- Updated Add to Cart Form -->
            <form action="{% url 'cart_add' %}" method="POST" class="d-flex align-items-center gap-3">
                {% csrf_token %}
                <input type="hidden" name="product_id" value="{{ product.id }}">
                <input type="number" name="product_qty" value="1" min="1" class="form-control text-center" style="width: 80px;">
                <button type="submit" class="btn btn-success btn-lg">Add to Cart 🛒</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
